<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q-IO | 建築石材放樣與幾何美學日誌</title>
    <meta name="description" content="專注於現場石材放樣、CAD 幾何工程與實務才數算量處置的建築視覺筆記。">
    
    <link rel="icon" type="image/png" href="https://24hr-168.com/favicon.ico">
    
    <style>
        :root {
            --bg-color: #fcfbf9;      /* 暖色紙感 */
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --text-sub: #7f8c8d;
            --border-color: #eae7e1;
            
            /* 馬卡龍色彩庫 */
            --tag-mint: #e8f5e9;
            --tag-mint-txt: #2e7d32;
            --tag-sky: #e3f2fd;
            --tag-sky-txt: #1565c0;
            --tag-sakura: #fce4ec;
            --tag-sakura-txt: #c2185b;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        /* 頂部 LOGO 區塊 */
        header {
            max-width: 800px;
            margin: 0 auto;
            padding: 2.5rem 1.2rem 1.5rem 1.2rem;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
        }

        .logo-title {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 3px;
            color: #34495e;
            margin: 0 0 0.4rem 0;
        }

        .logo-subtitle {
            font-size: 0.95rem;
            color: var(--text-sub);
            margin: 0;
            font-weight: 300;
            letter-spacing: 1px;
        }

        /* 導覽選單列 */
        nav {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-top: 1.2rem;
        }

        nav a {
            color: #546e7a;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            transition: color 0.2s;
        }

        nav a:hover {
            color: #1565c0;
        }

        /* 主內容卡片容器 */
        main {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1.2rem;
        }

        .section-title {
            font-size: 1rem;
            color: var(--text-sub);
            letter-spacing: 2px;
            margin-bottom: 1.2rem;
            text-transform: uppercase;
        }

        /* 📅 日歷撕頁風卡片結構 */
        .calendar-card {
            display: flex;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            margin-bottom: 1.5rem;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .calendar-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.05);
        }

        /* 左側：撕頁日曆方塊 */
        .calendar-date-box {
            background: #faf9f6;
            border-right: 1px dashed var(--border-color);
            padding: 1.2rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-width: 85px;
            text-align: center;
            box-sizing: border-box;
        }

        .cal-month {
            font-size: 0.75rem;
            font-weight: 800;
            color: var(--tag-sakura-txt);
            letter-spacing: 1px;
        }

        .cal-day {
            font-size: 1.8rem;
            font-weight: 800;
            color: #2c3e50;
            line-height: 1.1;
            margin: 0.2rem 0;
        }

        .cal-year, .cal-week {
            font-size: 0.7rem;
            color: #95a5a6;
        }

        /* 右側：日誌摘要內容 */
        .calendar-content {
            padding: 1.2rem 1.5rem;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .cal-title {
            margin: 0 0 0.5rem 0;
            font-size: 1.15rem;
            line-height: 1.4;
        }

        .cal-title a {
            color: var(--text-main);
            text-decoration: none;
            transition: color 0.2s;
        }

        .cal-title a:hover {
            color: #546e7a;
        }

        .cal-snippet {
            font-size: 0.88rem;
            color: #616161;
            line-height: 1.6;
            margin: 0 0 1rem 0;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .cal-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        /* 馬卡龍標籤庫 */
        .tag-group {
            display: flex;
            gap: 0.4rem;
        }

        .tag {
            font-size: 0.72rem;
            padding: 0.2rem 0.6rem;
            border-radius: 12px;
            font-weight: 600;
        }
        .tag-mint { background: var(--tag-mint); color: var(--tag-mint-txt); }
        .tag-sky { background: var(--tag-sky); color: var(--tag-sky-txt); }
        .tag-sakura { background: var(--tag-sakura); color: var(--tag-sakura-txt); }

        .read-more-btn {
            font-size: 0.85rem;
            color: #546e7a;
            font-weight: 700;
            text-decoration: none;
        }

        .read-more-btn:hover {
            text-decoration: underline;
        }

        /* 頁尾資訊 */
        footer {
            text-align: center;
            padding: 2rem 1.2rem;
            color: var(--text-sub);
            font-size: 0.8rem;
            border-top: 1px solid var(--border-color);
            margin-top: 3rem;
        }
    </style>
</head>
<body>

<header>
    <div class="logo-title">Q-IO</div>
    <div class="logo-subtitle">建築石材放樣 ✕ CAD 幾何美學 ✕ 現場實務隨筆</div>
    <nav>

    </nav>
</header>

<main>

            <span class="cal-month">MAY</span>

            <span class="cal-year">2026</span>

        </div>
        <div class="calendar-content">
            <h3 class="cal-title">
                <a href="articles/log-001.html">【現場實務】並排電梯框高低差 0.5 公分？門頭石材包板的「誤差吸收」眉角</a>

            </p>
            <div class="cal-footer">
                <div class="tag-group">
                    <span class="tag tag-mint">#石材放樣</span>
                    <span class="tag tag-sakura">#門框誤差</span>
                </div>
                <a href="articles/log-001.html" class="read-more-btn">翻閱日記 ➔</a>
            </div>
        </div>
    </article>

</main>

<footer>

</footer>

</body>
</html>
